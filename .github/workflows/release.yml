name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to build and publish (for example v0.1.0)'
        required: true
        type: string

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  verify:
    name: Verify version and tag
    runs-on: ubuntu-latest
    env:
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
    outputs:
      version: ${{ steps.versions.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - name: Check version sync and release tag
        id: versions
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $root = $env:GITHUB_WORKSPACE
          $packageVersion = (Get-Content (Join-Path $root "package.json") -Raw | ConvertFrom-Json).version
          $cargoVersion = [regex]::Match(
            (Get-Content (Join-Path $root "src-tauri/Cargo.toml") -Raw),
            '(?m)^version\s*=\s*"([^"]+)"'
          ).Groups[1].Value
          $tauriVersion = (Get-Content (Join-Path $root "src-tauri/tauri.conf.json") -Raw | ConvertFrom-Json).version
          $extensionVersion = (Get-Content (Join-Path $root "extension/package.json") -Raw | ConvertFrom-Json).version
          # WXT 的 manifest.version 是显式值，不会随 extension/package.json 自动变化，一并校验。
          $wxtConfig = Get-Content (Join-Path $root "extension/wxt.config.ts") -Raw
          $wxtVersion = [regex]::Match($wxtConfig, '(?m)^\s+version:\s*"([^"]+)"').Groups[1].Value

          $versions = [ordered]@{
            "package.json"              = $packageVersion
            "src-tauri/Cargo.toml"      = $cargoVersion
            "src-tauri/tauri.conf.json" = $tauriVersion
            "extension/package.json"    = $extensionVersion
            "extension/wxt.config.ts"   = $wxtVersion
          }

          $versions.GetEnumerator() | ForEach-Object {
            Write-Host ("{0}: {1}" -f $_.Key, $_.Value)
          }

          $distinct = @($versions.Values | Select-Object -Unique)
          if ($distinct.Count -ne 1 -or [string]::IsNullOrWhiteSpace($distinct[0])) {
            $summary = ($versions.GetEnumerator() | ForEach-Object { "$($_.Key)=$($_.Value)" }) -join ", "
            throw "Version mismatch: $summary"
          }

          $version = $distinct[0]
          $tag = "$env:RELEASE_TAG".Trim()
          if ([string]::IsNullOrWhiteSpace($tag)) {
            throw "RELEASE_TAG is empty; pass the release tag (for example v0.1.0)."
          }
          if ($tag -ne "v$version") {
            throw "Release tag '$tag' does not match project version 'v$version'."
          }

          Write-Host "Version sync OK: $version (tag $tag)"
          Add-Content -Path $env:GITHUB_OUTPUT -Value "version=$version"

  desktop:
    name: Build Windows installer (NSIS)
    needs: verify
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.28.5
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.99.1
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      # release profile 本身不开 C 依赖调试信息，不会触发本机历史 D8050 问题；
      # 不要为了 CI 修改 Cargo.toml 的 native-tls / debug=0 规避。
      - run: pnpm install --frozen-lockfile
      - name: Build NSIS installer
        run: pnpm tauri build --bundles nsis
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-nsis
          path: src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error

  extension:
    name: Build Firefox extension (.xpi)
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.28.5
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm -C extension build:firefox
      - run: pnpm -C extension lint:firefox
      - run: pnpm -C extension package:firefox
      - uses: actions/upload-artifact@v4
        with:
          name: firefox-xpi
          path: extension/dist/*.xpi
          if-no-files-found: error

  release:
    name: Publish draft release
    needs: [verify, desktop, extension]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    env:
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true
      - name: Generate SHA256SUMS
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $assets = @(
            Get-ChildItem -Path release-assets -File |
              Where-Object { $_.Name -ne "SHA256SUMS" } |
              Sort-Object Name
          )
          if ($assets.Count -eq 0) {
            throw "No release assets were downloaded."
          }

          $lines = foreach ($asset in $assets) {
            $hash = (Get-FileHash -Path $asset.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
            "{0}  {1}" -f $hash, $asset.Name
          }
          $lines | Set-Content -Path release-assets/SHA256SUMS -Encoding ascii
          Get-Content release-assets/SHA256SUMS
      - name: Create draft GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: LexiGrab ${{ needs.verify.outputs.version }}
          target_commitish: ${{ github.sha }}
          draft: true
          prerelease: false
          fail_on_unmatched_files: true
          files: |
            release-assets/*.exe
            release-assets/*.xpi
            release-assets/SHA256SUMS
          body: |
            LexiGrab ${{ needs.verify.outputs.version }}

            ## 安装

            - **Windows**：下载并运行 `LexiGrab_${{ needs.verify.outputs.version }}_x64-setup.exe`（NSIS 安装包）。
            - **Firefox 扩展**：下载 `lexigrab-firefox-${{ needs.verify.outputs.version }}.xpi`，在 `about:addons` 的齿轮菜单里选择“从文件安装附加组件”。

            ## 校验下载

            `SHA256SUMS` 由 CI 对所有安装包生成。Windows PowerShell 校验示例：

            ```powershell
            Get-FileHash .\LexiGrab_${{ needs.verify.outputs.version }}_x64-setup.exe -Algorithm SHA256
            Get-Content .\SHA256SUMS
            ```

            输出的哈希应与 `SHA256SUMS` 中对应行一致。

            ## 已知限制

            - **Windows 安装包未签名**：SmartScreen 可能提示“Windows 已保护你的电脑”。选择“更多信息 → 仍要运行”，并用 `SHA256SUMS` 校验文件完整性。
            - **Firefox 扩展未签名**：Firefox 正式版默认拒绝安装未签名扩展。该 `.xpi` 需要允许自托管的 Firefox（例如开发者版/ESR 并设置 `xpinstall.signatures.required=false`），或在 `about:debugging` 中临时加载。
            - 其他已知限制见 [README 的“已知限制”](https://github.com/ZouBeining/LexiGrab/blob/main/README.md#已知限制)。
