[package]
name = "lexigrab"
version = "0.1.0"
description = "LexiGrab 划词词典桌面端"
authors = ["ZouBeining"]
edition = "2021"
rust-version = "1.99"
license = "AGPL-3.0-or-later"
publish = false
# `tauri dev` 用 `cargo run --no-default-features`，有多个 bin 时必须指定默认目标。
default-run = "lexigrab"

[lib]
name = "lexigrab_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.4", features = [] }

[dependencies]
tauri = { version = "2.12.5", features = ["tray-icon"] }
tauri-plugin-global-shortcut = "2.4.1"
tauri-plugin-single-instance = "2"
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
serde = { version = "1.0.215", features = ["derive"] }
serde_json = "1.0.140"
thiserror = "2.0.11"
tracing = "0.1.41"
tracing-subscriber = { version = "0.3.19", features = ["env-filter"] }
tracing-appender = "0.2.3"
toml = "0.8.19"
uuid = { version = "1.17", features = ["v4", "v5"] }
unicode-normalization = "0.1.24"
percent-encoding = "2.3.1"
url = "2.5.2"
mime_guess = "2.0.4"
ammonia = "4.0.0"
lol_html = "2.6.0"
scraper = "0.24.0"
clap = { version = "4.5.23", features = ["derive"] }
# 不用默认 rustls/aws-lc-sys：本机 MSVC 编译 aws-lc 的 C 代码失败（cl D8050），
# Windows 用 native-tls（Schannel）即满足远程 HTTPS 需求。
reqwest = { version = "0.13.0", default-features = false, features = [
  "blocking",
  "json",
  "native-tls",
] }
mdictlib = "0.2.8"
# saved_cards 语境指纹库；bundled 让 SQLite 随构建产物分发，不依赖系统 DLL。
rusqlite = { version = "0.32", features = ["bundled"] }
# M3 本地桥接：只监听 127.0.0.1，axum 复用 Tauri 已有的 tokio 运行时。
axum = { version = "0.8.1", default-features = false, features = [
  "http1",
  "json",
  "tokio",
] }
tokio = { version = "1.43.0", features = ["net", "sync", "time"] }

[dev-dependencies]
wiremock = "0.6.2"
http-body-util = "0.1.2"
tower = { version = "0.5.2", features = ["util"] }
tokio = { version = "1.43.0", features = ["macros", "rt-multi-thread", "net", "io-util", "time"] }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62.0", features = [
  "Win32_Foundation",
  "Win32_UI_WindowsAndMessaging",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_UI_Accessibility",
  "Win32_UI_Controls",
  "Win32_UI_Shell",
  "Win32_UI_HiDpi",
  "Win32_System_DataExchange",
  "Win32_System_Memory",
  "Win32_System_Threading",
  "Win32_System_LibraryLoader",
  "Win32_System_Com",
  "Win32_Graphics_Gdi",
] }
raw-window-handle = "0.6.2"

[profile.dev]
incremental = true
# 本机 MSVC 在自定义 debug 记录下编译 C 代码会报 D8050（aws-lc / SQLite 同样问题），
# 关闭 C 依赖的调试信息；Rust 侧仍保留 symbol 用于回溯。
debug = 0

[profile.release]
codegen-units = 1
lto = true
panic = "abort"
strip = true
