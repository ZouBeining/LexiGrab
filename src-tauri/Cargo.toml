[package]
name = "lexigrab"
version = "0.1.0"
description = "LexiGrab 划词词典桌面端"
authors = ["ZouBeining"]
edition = "2021"
rust-version = "1.99"
license = "AGPL-3.0-or-later"
publish = false

[lib]
name = "lexigrab_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.4", features = [] }

[dependencies]
tauri = { version = "2.12.5", features = ["tray-icon"] }
tauri-plugin-global-shortcut = "2.4.1"
serde = { version = "1.0.215", features = ["derive"] }
serde_json = "1.0.140"
thiserror = "2.0.11"
tracing = "0.1.41"
tracing-subscriber = { version = "0.3.19", features = ["env-filter"] }
tracing-appender = "0.2.3"
toml = "0.8.19"
uuid = { version = "1.17", features = ["v4"] }
unicode-normalization = "0.1.24"
percent-encoding = "2.3.1"
url = "2.5.2"
mime_guess = "2.0.4"
ammonia = "4.0.0"
lol_html = "2.6.0"
scraper = "0.24.0"
clap = { version = "4.5.23", features = ["derive"] }
# 不用默认 rustls/aws-lc-sys：本机 MSVC 编译 aws-lc 的 C 代码失败（cl D8050），
# Windows 用 native-tls（Schannel）即满足远程 HTTPS 需求。
reqwest = { version = "0.13.0", default-features = false, features = [
  "blocking",
  "json",
  "native-tls",
] }
mdictlib = "0.2.8"

[dev-dependencies]
wiremock = "0.6.2"
tokio = { version = "1.43.0", features = ["macros", "rt-multi-thread"] }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62.0", features = [
  "Win32_Foundation",
  "Win32_UI_WindowsAndMessaging",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_UI_Accessibility",
  "Win32_UI_Controls",
  "Win32_UI_Shell",
  "Win32_UI_HiDpi",
  "Win32_System_DataExchange",
  "Win32_System_Memory",
  "Win32_System_Threading",
  "Win32_System_LibraryLoader",
  "Win32_System_Com",
  "Win32_Graphics_Gdi",
] }
raw-window-handle = "0.6.2"

[profile.dev]
incremental = true

[profile.release]
codegen-units = 1
lto = true
panic = "abort"
strip = true
